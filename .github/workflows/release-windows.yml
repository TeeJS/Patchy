# Builds, signs, and publishes the Windows release.
#
# Push a tag named v<version> (matching project(... VERSION) in CMakeLists.txt) to create
# a GitHub Release with PatchyWindowsInstaller.exe and PatchyWindowsNoInstaller.zip.
# Running the workflow by hand (workflow_dispatch) builds and signs the same packages and
# keeps them as a run artifact without creating a release.
#
# Signing uses Azure Artifact Signing through a GitHub OIDC login: the "release"
# environment's federated credential, no stored client secret. See
# docs/release-process.md, "GitHub Releases (TeeJS fork, Windows)".
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    environment: release
    timeout-minutes: 240
    env:
      NO_PAUSE: '1'
      PATCHY_SIGN_SCRIPT: ${{ github.workspace }}\scripts\release\sign-azure.ps1
      PATCHY_SIGNING_DIR: ${{ github.workspace }}\.signing
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw CMakeLists.txt
          $m = [regex]::Match($text, 'project\s*\([\s\S]*?\bVERSION\s+([0-9]+(?:\.[0-9]+){1,3})')
          if (-not $m.Success) { throw 'Could not read the version from CMakeLists.txt.' }
          $version = $m.Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match CMakeLists.txt version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtimageformats qtpdf'
          dir: ${{ github.workspace }}\.deps
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The signer role is scoped to the signing account, not the subscription.
          allow-no-subscriptions: true

      - name: Fetch the Artifact Signing dlib
        shell: pwsh
        run: |
          $dest = $env:PATCHY_SIGNING_DIR
          New-Item -ItemType Directory -Force "$dest\dlib-x64" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'tsc.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'tsc'
          Invoke-WebRequest -UseBasicParsing 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/1.0.95' -OutFile $zip
          Expand-Archive $zip $extract -Force
          $dll = Get-ChildItem $extract -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dll) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found in the package.' }
          Copy-Item "$(Split-Path $dll.FullName)\*" "$dest\dlib-x64\" -Recurse -Force
          # Only the Azure CLI session from azure/login may authenticate.
          $json = @'
          {
            "Endpoint": "https://eus.codesigning.azure.net/",
            "CodeSigningAccountName": "openquakesigning",
            "CertificateProfileName": "openquake-public",
            "ExcludeCredentials": [ "EnvironmentCredential", "WorkloadIdentityCredential", "ManagedIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential" ]
          }
          '@
          [IO.File]::WriteAllText("$dest\metadata.json", $json, (New-Object Text.UTF8Encoding($false)))

      - name: Build, sign, and package
        shell: cmd
        env:
          # sign-azure.ps1 re-logs in with a fresh OIDC token before each signature.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: scripts\release\build-release.bat

      - name: Core tests
        shell: pwsh
        working-directory: build\release
        run: |
          # Known runner-only failure, allowed here and nowhere else: Windows Server has no
          # HEVC codec and reports it as WINCODEC_ERR_COMPONENTNOTFOUND (0x88982f8b), which
          # the test's "decoder unavailable" skip does not recognize.
          $allowed = @('heif_reads_quadrant_fixture_if_available')
          $output = & .\patchy_core_tests.exe 2>&1 | ForEach-Object { "$_" }
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          $failures = @($output | Where-Object { $_ -match '^\[FAIL\] ([^:]+)' })
          $unexpected = @($failures | Where-Object { $_ -match '^\[FAIL\] ([^:]+)' -and $allowed -notcontains $Matches[1].Trim() })
          if ($unexpected.Count -gt 0) { $unexpected | Write-Host; throw "$($unexpected.Count) core test(s) failed." }
          if ($exitCode -ne 0 -and $failures.Count -eq 0) { throw "Core tests exited with $exitCode and no [FAIL] line (crash?)." }
          if ($failures.Count -gt 0) { Write-Host "Ignored known runner-only failure(s): $($failures -join '; ')" }
          # The pwsh step wrapper would otherwise fail on the test binary's exit code.
          exit 0

      - name: Upload packages as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchy-windows-${{ steps.version.outputs.version }}
          path: |
            build\package\PatchyWindowsInstaller.exe
            build\package\PatchyWindowsNoInstaller.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            build\package\PatchyWindowsInstaller.exe `
            build\package\PatchyWindowsNoInstaller.zip `
            --title 'Patchy ${{ steps.version.outputs.version }}' `
            --generate-notes `
            --verify-tag
